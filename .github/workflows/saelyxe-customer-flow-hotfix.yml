          notice = '''              {verificationNotice && (
                <div className={`mb-5 rounded-xl border px-4 py-3 text-xs leading-relaxed ${verificationNotice === 'success' ? 'border-emerald-200 bg-emerald-50 text-emerald-900' : 'border-rose-200 bg-rose-50 text-rose-800'}`}>
                  {verificationNotice === 'success' ? 'Email verified successfully. You can sign in to your SAELYXE account now.' : 'That verification link is invalid or expired. Sign in to request a fresh SAELYXE verification email.'}
                </div>
              )}
'''
          if 'Email verified successfully.' not in s:
              if marker not in s:
                  raise SystemExit('AuthModal form marker missing')
              s = s.replace(marker, notice + marker, 1)
          p.write_text(s)
          PY

      - name: Install and verify hotfix
        working-directory: House-OF-Saelyx
        run: |
          npm ci
          npm run security:check
          npm run final:readiness
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build

      - name: Commit verified hotfix to production main
        shell: bash
        run: |
          git config user.name "SAELYXE Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add House-OF-Saelyx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(storefront): restore guest COD and repair customer account flows"
          git push origin HEAD:main
