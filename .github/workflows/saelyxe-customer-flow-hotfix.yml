name: SAELYXE Customer Flow Hotfix

on:
  push:
    branches: [maintenance/fix-customer-flow-20260911]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: House-OF-Saelyx/package-lock.json

      - name: Apply screenshot customer-flow fixes
        working-directory: House-OF-Saelyx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'expected one regex target for {label}, found {count}')
              return updated

          # App: guest customers must be allowed to reach checkout.
          p = 'src/App.tsx'
          s = read(p)
          s = sub_once(
              s,
              r"      case 'checkout':\n        if \(!user\) \{.*?\n        return <CheckoutPage key=\{user\.uid\} />;",
              "      case 'checkout':\n        return <CheckoutPage />;",
              'App guest checkout gate'
          )
          write(p, s)

          # Checkout: preserve Google Pay review mode while restoring guest + COD checkout.
          p = 'src/components/CheckoutPage.tsx'
          s = read(p)
          if 'function createCodCheckoutAttemptId()' not in s:
              marker = 'const PayzyMark: React.FC<{ className?: string }> = ({ className = \'w-8 h-8\' }) => ('
              cod_helper = '''function createCodCheckoutAttemptId() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
              return `cod-${crypto.randomUUID()}`;
            }
            if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
              const values = new Uint32Array(4);
              crypto.getRandomValues(values);
              return `cod-${Array.from(values, value => value.toString(36)).join('-')}`;
            }
            throw new Error('Secure checkout identifier generation is unavailable.');
          }

          '''
              s = once(s, marker, cod_helper + marker, 'COD idempotency helper')

          s = once(
              s,
              "const [paymentMethod, setPaymentMethod] = useState<'paypal' | 'payzy' | 'googlepay' | null>(null);",
              "const [paymentMethod, setPaymentMethod] = useState<'paypal' | 'payzy' | 'cod' | 'googlepay' | null>(null);",
              'checkout payment method union'
          )
          s = once(
              s,
              '  const paypalCheckoutAttemptIdRef = useRef<string | null>(null);\n  const payzyCheckoutAttemptIdRef = useRef<string | null>(null);',
              '  const paypalCheckoutAttemptIdRef = useRef<string | null>(null);\n  const codCheckoutAttemptIdRef = useRef<string | null>(null);\n  const payzyCheckoutAttemptIdRef = useRef<string | null>(null);',
              'COD checkout ref'
          )
          s = once(
              s,
              "    if (!user && !isPayzyReturn) {\n      navigateTo({ name: 'home' });\n      setIsCartOpen(true);\n      setIsAuthOpen(true);\n      return;\n    }\n",
              '',
              'guest checkout redirect'
          )
          s = s.replace('  }, [user, cart.length, confirmedOrder, navigateTo, setIsCartOpen, setIsAuthOpen]);', '  }, [cart.length, confirmedOrder, navigateTo, setIsCartOpen]);', 1)
          s = once(
              s,
              "  const handlePaymentMethodChange = async (method: 'paypal' | 'payzy' | 'googlepay') => {",
              "  const handlePaymentMethodChange = async (method: 'paypal' | 'payzy' | 'cod' | 'googlepay') => {",
              'payment switch COD union'
          )

          cod_handler = '''  const handleCodOrder = async () => {
            if (cart.length === 0) {
              setFieldErrors(previous => ({ ...previous, general: 'Your shopping bag is empty. Please select garments before placing an order.' }));
              return;
            }
            if (!validateDeliveryDetails()) return;
            if (country.trim().toLowerCase() !== 'sri lanka') {
              setFieldErrors(previous => ({ ...previous, general: 'Cash on Delivery is currently available only for Sri Lankan delivery addresses.' }));
              return;
            }

            setIsSubmitting(true);
            setFieldErrors(previous => ({ ...previous, general: undefined }));
            try {
              const order = await createOrder({
                customerName,
                firstName: firstName.trim(),
                lastName: lastName.trim(),
                email: email.trim().toLowerCase(),
                phone: phone.trim(),
                address: address.trim(),
                city: city.trim(),
                postalCode: postalCode.trim(),
                country: country.trim() || 'Sri Lanka',
                items: cart.map(item => ({ productId: item.productId, size: item.size, quantity: item.quantity })),
                currencyUsed: selectedCurrency?.code || 'LKR',
                paymentMethod: 'cod',
                promoCode: appliedPromo?.code,
                checkoutAttemptId: codCheckoutAttemptIdRef.current || (codCheckoutAttemptIdRef.current = createCodCheckoutAttemptId()),
                notes: notes.trim()
              });
              persistDeliveryDetailsIfNeeded();
              setConfirmedOrder(order);
              codCheckoutAttemptIdRef.current = null;
              clearCart();
            } catch (error) {
              console.error('COD checkout exception:', error);
              setFieldErrors(previous => ({ ...previous, general: error instanceof Error ? error.message : 'Cash on Delivery order could not be placed.' }));
            } finally {
              setIsSubmitting(false);
            }
          };

          '''
          if 'const handleCodOrder = async () =>' not in s:
              s = once(s, '  const handlePayzyOrder = async () => {', cod_handler + '  const handlePayzyOrder = async () => {', 'COD handler')

          s = once(
              s,
              "  const handlePayzyOrder = async () => {\n    if (!user) {\n      setIsAuthOpen(true);\n      return;\n    }\n",
              "  const handlePayzyOrder = async () => {\n",
              'Payzy guest block'
          )

          # Remove the component-level sign-in wall.
          s = sub_once(
              s,
              r"\n  if \(!user\) \{\n    return \(.*?\n  \}\n\n  if \(googlePayTestComplete\)",
              "\n  if (googlePayTestComplete)",
              'Checkout sign-in wall'
          )

          s = once(s, '<span>Secure Account Checkout</span>', '<span>{user ? \'Secure Account Checkout\' : \'Secure Guest Checkout\'}</span>', 'checkout status label')
          s = once(
              s,
              "{googlePayReviewMode ? 'PayPal, Payzy, or Google Pay TEST review.' : 'PayPal or Payzy only. Cash on Delivery is not available.'}",
              "{googlePayReviewMode ? 'PayPal, Payzy, Cash on Delivery, or Google Pay TEST review.' : 'PayPal, Payzy, or Cash on Delivery.'}",
              'payment method help text'
          )

          s = s.replace("                            if (!user) {\n                              setIsAuthOpen(true);\n                              return false;\n                            }\n", '', 1)
          s = s.replace("createOrder={async () => { if (!user) throw new Error('Sign in before checkout.'); if (!validateDeliveryDetails())", "createOrder={async () => { if (!validateDeliveryDetails())", 1)

          cod_card = '''                <div className={`rounded-2xl border overflow-hidden ${paymentMethod === 'cod' ? 'border-[#1A1816] ring-1 ring-[#1A1816]' : 'border-[#E7E0D6]'}`}>
                    <button type="button" role="radio" aria-label="Cash on Delivery" aria-checked={paymentMethod === 'cod'} disabled={isSubmitting || isSwitchingPayment} onClick={() => handlePaymentMethodChange('cod')} className="w-full text-left p-4 sm:p-5 flex items-center justify-between gap-4 disabled:cursor-wait">
                      <div className="flex items-center gap-3.5">
                        <div className="w-12 h-12 rounded-xl bg-[#F6F1E9] border border-[#E5DDD2] flex items-center justify-center"><Truck className="w-5 h-5 text-[#574A3D]" /></div>
                        <div><span className="text-sm font-semibold text-[#1A1816]">Cash on Delivery</span><p className="text-[11px] text-[#665A4E] mt-1">Pay in cash when your order is delivered.</p></div>
                      </div>
                      <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${paymentMethod === 'cod' ? 'border-[#1A1816]' : 'border-[#D5CBBF]'}`}>{paymentMethod === 'cod' && <div className="w-2.5 h-2.5 rounded-full bg-[#1A1816]" />}</div>
                    </button>
                    {paymentMethod === 'cod' && (
                      <div className="px-4 sm:px-5 pb-5 pt-4 border-t border-[#EEE8DF] space-y-4">
                        <div className="rounded-xl bg-[#FAF8F5] border border-[#E5DFD7] p-4">
                          <p className="text-[10px] uppercase tracking-[0.16em] text-[#8A7762]">Cash on Delivery total</p>
                          <p className="font-serif text-xl mt-1">LKR {totalLKR.toLocaleString('en-US')}</p>
                          <p className="text-[11px] text-[#74685B] mt-2">No online charge is made. Payment remains pending until cash is collected on delivery.</p>
                        </div>
                        <button id="btn-cod-place-order" type="button" onClick={handleCodOrder} disabled={isSubmitting} className="w-full min-h-[52px] rounded-xl bg-[#1A1816] text-white text-[11px] uppercase tracking-[0.18em] font-semibold disabled:opacity-50 flex items-center justify-center gap-3">
                          <Truck className="w-4 h-4" />{isSubmitting ? 'PLACING ORDER...' : 'PLACE CASH ON DELIVERY ORDER'}
                        </button>
                      </div>
                    )}
                  </div>

          '''
          if 'id="btn-cod-place-order"' not in s:
              s = once(s, '                {paymentConfig.paypal.enabled && (', cod_card + '                {paymentConfig.paypal.enabled && (', 'COD payment card')

          s = once(
              s,
              "{confirmedOrder.paymentMethod === 'paypal' ? 'PayPal' : 'Payzy'}",
