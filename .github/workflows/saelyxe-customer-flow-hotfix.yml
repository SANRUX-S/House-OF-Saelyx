          observer_marker = '''      // If an email signup is in-flight, allow signupWithEmail to write the definitive profile with the real customer name
      if (activeSignupEmailRef.current === fbUser.email?.trim().toLowerCase()) {
        return;
      }

      try {'''
          observer_repl = '''      // If an email signup is in-flight, allow signupWithEmail to write the definitive profile with the real customer name
      if (activeSignupEmailRef.current === fbUser.email?.trim().toLowerCase()) {
        return;
      }

      const passwordProvider = fbUser.providerData.some(provider => provider.providerId === 'password');
      const configuredSessionRole = getConfiguredAdminRole(fbUser.email, fbUser.emailVerified);
      if (passwordProvider && !fbUser.emailVerified && !configuredSessionRole) {
        setUser(null);
        return;
      }

      try {'''
          s = once(s, observer_marker, observer_repl, 'unverified password observer guard')

          s = once(
              s,
              '    const currentUser = auth.currentUser;\n    const token = currentUser ? await currentUser.getIdToken() : null;',
              "    const currentUser = auth.currentUser;\n    const passwordNeedsVerification = Boolean(currentUser?.providerData.some(provider => provider.providerId === 'password') && !currentUser.emailVerified && !getConfiguredAdminRole(currentUser.email, currentUser.emailVerified));\n    const token = currentUser && !passwordNeedsVerification ? await currentUser.getIdToken() : null;",
              'public API token gating'
          )

          verification_effect = '''
  // Handle branded SAELYXE verification links on our own domain instead of the Firebase default action page.
  useEffect(() => {
    if (window.location.pathname !== '/verify-email') return;
    const code = new URLSearchParams(window.location.search).get('code')?.trim() || '';
    let cancelled = false;

    void (async () => {
      try {
        if (!code) throw new Error('missing_verification_code');
        await applyActionCode(auth, code);
        try { await fbSignOut(auth); } catch { /* verification is already complete */ }
        if (cancelled) return;
        setUser(null);
        sessionStorage.setItem('saelyxe_email_verification_notice', 'success');
      } catch {
        if (cancelled) return;
        sessionStorage.setItem('saelyxe_email_verification_notice', 'error');
      } finally {
        if (cancelled) return;
        window.history.replaceState({}, '', '/');
        setAuthMode('signin');
        setIsAuthOpen(true);
      }
    })();

    return () => { cancelled = true; };
  }, []);

'''
          marker = '  // Listen to Firebase Auth state. Privileged roles come only from trusted\n'
          if 'saelyxe_email_verification_notice' not in s:
              s = once(s, marker, verification_effect + marker, 'verification route effect')

          helper = '''  const dispatchCustomerVerification = async (fbUser: any, displayName?: string) => {
