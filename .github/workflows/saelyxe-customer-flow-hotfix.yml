                ) : null}'''
          new_remember = old_remember.replace('{!hasSavedDetails ? (', '{user && (!hasSavedDetails ? (').replace('                ) : null}', '                ) : null)}')
          if old_remember in s:
              s = s.replace(old_remember, new_remember, 1)
          write(p, s)

          # Store context: verified email/password accounts only; guest commerce remains available.
          p = 'src/context/StoreContext.tsx'
          s = read(p)
