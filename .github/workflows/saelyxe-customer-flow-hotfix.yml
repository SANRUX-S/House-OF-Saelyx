'''
          if 'const dispatchCustomerVerification' not in s:
              s = once(s, '  const loginWithEmail = async (email: string, pass: string): Promise<boolean> => {', helper + '  const loginWithEmail = async (email: string, pass: string): Promise<boolean> => {', 'verification dispatch helper')

          login_marker = '''      const res = await signInWithEmailAndPassword(auth, email.trim().toLowerCase(), pass);
      const fbUser = res.user;

      let existingData: Partial<AppUser> = {};'''
          login_repl = '''      const res = await signInWithEmailAndPassword(auth, email.trim().toLowerCase(), pass);
      const fbUser = res.user;

      if (!fbUser.emailVerified && !getConfiguredAdminRole(fbUser.email, fbUser.emailVerified)) {
