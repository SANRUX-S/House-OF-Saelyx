        }
        await fbSignOut(auth);
        setUser(null);
        setAuthError('Please verify your email before signing in. We sent a new SAELYXE verification link to your inbox.');
        return false;
      }

      let existingData: Partial<AppUser> = {};'''
          s = once(s, login_marker, login_repl, 'email login verification gate')

          old_signup_mail = '''      // Send verification email safely
      try {
        await sendEmailVerification(res.user);
      } catch (verifyErr) {
        console.warn('Verification email dispatch note:', verifyErr);
      }
'''
          new_signup_mail = '''      // Send the branded SAELYXE verification message from the configured Resend sender.
      // Firebase's default template remains an emergency fallback only.
      try {
        await dispatchCustomerVerification(res.user, cleanName);
      } catch (verifyErr) {
        console.warn('Branded verification email dispatch note:', verifyErr);
        try { await sendEmailVerification(res.user); } catch (fallbackErr) { console.warn('Firebase verification fallback note:', fallbackErr); }
      }
'''
          s = once(s, old_signup_mail, new_signup_mail, 'signup branded verification')
          s = once(
              s,
              '      setUser(newUser);\n      activeSignupEmailRef.current = null;\n      return true;',
              "      await fbSignOut(auth);\n      setUser(null);\n      activeSignupEmailRef.current = null;\n      return true;",
              'signup sign-out before verification'
          )
          write(p, s)

          # Guest order capability helper: list only non-expired local order IDs.
          p = 'src/lib/guestOrderAccess.ts'
          s = read(p)
          if 'export function listGuestOrderAccessIds' not in s:
              s += '''\nexport function listGuestOrderAccessIds(): string[] {
            const store = readStore();
            const now = Date.now();
            let changed = false;
            for (const [orderId, record] of Object.entries(store)) {
              const expiresMs = Date.parse(record?.expiresAt || '');
              if (!record?.token || (Number.isFinite(expiresMs) && expiresMs <= now)) {
                delete store[orderId];
                changed = true;
              }
            }
            if (changed) writeStore(store);
            return Object.keys(store);
          }
          '''
          write(p, s)

          # My Orders: show secure local guest orders, and keep them visible after later account sign-in.
          p = 'src/components/OrdersPage.tsx'
          s = read(p)
          s = once(s, "import { openOrderReceipt } from '../lib/orderReceipt';", "import { openOrderReceipt } from '../lib/orderReceipt';\nimport { getAppCheckRequestHeaders } from '../lib/firebase';\nimport { guestOrderAccessHeaders, listGuestOrderAccessIds } from '../lib/guestOrderAccess';", 'orders guest imports')
          old_orders_block = '''  // Filter orders belonging to the authenticated customer
  const userOrders = orders.filter(o => {
    if (!user) return false;
    if (o.userId && o.userId === user.uid) return true;
