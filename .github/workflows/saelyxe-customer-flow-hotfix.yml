name: SAELYXE Customer Flow Hotfix

on:
  push:
    branches:
      - maintenance/fix-customer-flow-20260911

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patcher and reset to production main
        shell: bash
        run: |
          cp .github/hotfix/customer_flow.py /tmp/customer_flow.py
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/customer_flow.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: House-OF-Saelyx/package-lock.json

      - name: Install dependencies
        working-directory: House-OF-Saelyx
        run: npm ci

      - name: Security regression
        working-directory: House-OF-Saelyx
        run: npm run security:check

      - name: Final readiness
        working-directory: House-OF-Saelyx
        run: npm run final:readiness

      - name: Production dependency audit
        working-directory: House-OF-Saelyx
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        working-directory: House-OF-Saelyx
        run: npm run lint

      - name: Production build
        working-directory: House-OF-Saelyx
        run: npm run build

      - name: Push verified hotfix to main
        shell: bash
        run: |
          git config user.name "SAELYXE Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add House-OF-Saelyx
          git commit -m "fix(storefront): restore guest COD and repair customer account flows"
          git push origin HEAD:main
