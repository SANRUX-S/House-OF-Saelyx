name: SAELYXE CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: House-OF-Saelyx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: House-OF-Saelyx/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security regression check
        run: npm run security:check

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install isolated QA tooling
        run: npm install --no-save --package-lock=false @playwright/test firebase-tools @firebase/rules-unit-testing

      - name: Firestore authorization emulator tests
        run: npm run rules:test

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end security smoke
        run: npm run e2e
