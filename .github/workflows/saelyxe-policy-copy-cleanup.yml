name: SAELYXE Policy Copy Cleanup

on:
  push:
    branches:
      - maintenance/align-cod-guest-copy
    paths:
      - .github/workflows/saelyxe-policy-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Final wording cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('House-OF-Saelyx')
          changed = []

          def update(path: Path, transform):
              original = path.read_text(encoding='utf-8')
              text = transform(original)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Remove the old Atelier branding term from customer/admin component copy.
          for path in (root / 'src/components').rglob('*.tsx'):
              def transform(text: str) -> str:
                  text = text.replace('available at the SAELYXE', 'available at SAELYXE')
                  text = text.replace('at the SAELYXE catalog', 'in the SAELYXE catalog')
                  text = text.replace('Return to SAELYXE Catalog', 'Return to SAELYXE Catalog')
                  text = re.sub(r'\batelier\b', 'studio', text, flags=re.IGNORECASE)
                  return text
              update(path, transform)

          # Remove the stale wording from schema/SEO metadata while retaining legacy redirect protection elsewhere.
          blueprint = root / 'firebase-blueprint.json'
          if blueprint.exists():
              update(blueprint, lambda text: re.sub(r'\batelier\b', 'SAELYXE', text, flags=re.IGNORECASE))

          index = root / 'index.html'
          update(index, lambda text: re.sub(r'\batelier\b', 'luxury', text, flags=re.IGNORECASE))

          robots = root / 'public/robots.txt'
          update(robots, lambda text: re.sub(r'\batelier\b', 'SAELYXE', text, flags=re.IGNORECASE))

          # Keep legal/storage truth consistent with production behavior.
          terms = root / 'src/components/LegalTermsPage.tsx'
          update(terms, lambda text: text.replace('No Guest Checkout', 'Guest Checkout Available'))

          privacy = root / 'src/components/LegalPrivacyPage.tsx'
          update(privacy, lambda text: text.replace('Cloudinary', 'Firebase Storage'))

          print('Changed files:')
          for item in changed:
              print(f' - {item}')
          PY

      - name: Verify final production copy
        shell: bash
        run: |
          set -euo pipefail
          TERMS="House-OF-Saelyx/src/components/LegalTermsPage.tsx"
          PRIVACY="House-OF-Saelyx/src/components/LegalPrivacyPage.tsx"
          ENVFILE="House-OF-Saelyx/.env.example"
          README="House-OF-Saelyx/README.md"

          grep -q "Guest Checkout Available" "$TERMS"
          grep -q "guest checkout" "$TERMS"
          grep -q "Cash on Delivery" "$TERMS"
          ! grep -q "No Guest Checkout" "$TERMS"
          ! grep -qi "Cloudinary" "$PRIVACY"
          ! grep -q "CLOUDINARY_" "$ENVFILE"
          ! grep -qi "Cloudinary" "$README"
          ! grep -RqiE '\batelier\b' House-OF-Saelyx/src/components House-OF-Saelyx/index.html House-OF-Saelyx/public/robots.txt House-OF-Saelyx/firebase-blueprint.json
          ! grep -Eq '\bSAELYX\b' House-OF-Saelyx/data/saelyx_store.json

      - name: Commit final pass to production main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No further wording changes required."
            exit 0
          fi
          git config user.name "SAELYXE Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add House-OF-Saelyx
          git commit -m "fix(content): finish SAELYXE policy and wording cleanup"
          git push origin HEAD:main
