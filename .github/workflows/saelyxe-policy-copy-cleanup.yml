name: SAELYXE Policy Copy Cleanup

on:
  push:
    branches:
      - maintenance/align-cod-guest-copy
    paths:
      - .github/workflows/saelyxe-policy-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Align security regression with current production providers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('House-OF-Saelyx/scripts/security-regression.mjs')
          original = path.read_text(encoding='utf-8')
          old = "assert(privacyPage.includes('Firebase / Google Cloud') && privacyPage.includes('Vercel') && privacyPage.includes('Cloudinary') && privacyPage.includes('Resend'), 'Privacy Policy must identify production technology service providers');"
          new = "assert(privacyPage.includes('Firebase / Google Cloud') && privacyPage.includes('product-media storage') && privacyPage.includes('Vercel') && privacyPage.includes('Resend') && !privacyPage.includes('Cloudinary'), 'Privacy Policy must identify current production technology service providers and Firebase media storage');"
          if old not in original:
              raise SystemExit('Expected stale provider assertion was not found.')
          path.write_text(original.replace(old, new), encoding='utf-8')
          PY

      - name: Run security regression before commit
        working-directory: House-OF-Saelyx
        run: npm run security:check

      - name: Commit regression correction to production main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SAELYXE Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add House-OF-Saelyx/scripts/security-regression.mjs
          git commit -m "test(security): align privacy provider gate with Firebase Storage"
          git push origin HEAD:main
