name: SAELYXE Policy Copy Cleanup

on:
  push:
    branches:
      - maintenance/align-cod-guest-copy
    paths:
      - .github/workflows/saelyxe-policy-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Polish customer wording and retain legacy route block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('House-OF-Saelyx')
          replacements = {
              root / 'public/robots.txt': [
                  ('Disallow: /SAELYXE-console', 'Disallow: /atelier-console'),
              ],
              root / 'index.html': [
                  ('SAELYXE luxury Drop', 'SAELYXE Luxury Collection'),
              ],
              root / 'src/components/CheckoutPage.tsx': [
                  ('Please contact studio support.', 'Please contact SAELYXE support.'),
              ],
              root / 'src/components/ContactSupportPage.tsx': [
                  ('Our Colombo studio directors and dedicated logistics concierges are on standby for your bespoke requests.', 'Our SAELYXE support and logistics team is ready to assist with your requests.'),
              ],
              root / 'src/components/OrderConfirmationModal.tsx': [
                  ('Your bespoke order has been successfully placed in our studio ledger.', 'Your order has been successfully received by SAELYXE.'),
              ],
              root / 'src/components/ProfilePage.tsx': [
                  ('Your client profile and delivery details have been securely synchronized with the studio.', 'Your client profile and delivery details have been securely synchronized with SAELYXE.'),
              ],
              root / 'src/components/TrackOrderPage.tsx': [
                  ('contact studio support.', 'contact SAELYXE support.'),
              ],
              root / 'src/components/CareAuthenticityPage.tsx': [
                  ('our dedicated Colombo studio using premium heavyweight organic yarn', 'our dedicated Colombo production studio using premium heavyweight organic yarn'),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(f' - {item}')
          PY

      - name: Verify intended production behavior and copy
        shell: bash
        run: |
          set -euo pipefail
          TERMS="House-OF-Saelyx/src/components/LegalTermsPage.tsx"
          PRIVACY="House-OF-Saelyx/src/components/LegalPrivacyPage.tsx"
          ENVFILE="House-OF-Saelyx/.env.example"
          README="House-OF-Saelyx/README.md"
          ROBOTS="House-OF-Saelyx/public/robots.txt"

          grep -q "Guest Checkout Available" "$TERMS"
          grep -q "guest checkout" "$TERMS"
          grep -q "Cash on Delivery" "$TERMS"
          ! grep -q "No Guest Checkout" "$TERMS"
          ! grep -qi "Cloudinary" "$PRIVACY"
          ! grep -q "CLOUDINARY_" "$ENVFILE"
          ! grep -qi "Cloudinary" "$README"
          grep -q "Disallow: /atelier-console" "$ROBOTS"
          ! grep -q "Disallow: /SAELYXE-console" "$ROBOTS"
          ! grep -Eq '\bSAELYX\b' House-OF-Saelyx/data/saelyx_store.json

      - name: Commit final correction to production main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No further corrections required."
            exit 0
          fi
          git config user.name "SAELYXE Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add House-OF-Saelyx
          git commit -m "fix(content): polish SAELYXE customer copy and legacy route block"
          git push origin HEAD:main
